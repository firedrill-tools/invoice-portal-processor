name: check
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm ci --prefix firedrill --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix firedrill
      - run: npm run check:distribution
      - uses: actions/upload-artifact@v4
        with:
          name: invoice-portal-source
          path: dist/
